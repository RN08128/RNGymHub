<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Ficha de Treino - RNGymHub</title>
    <link rel="stylesheet" href="style-global.css">
    <link rel="stylesheet" href="create-workout.css">
</head>

<body>

    <header class="main-header">
        <div class="nav-container">
            <a href="workouts.html" class="brand-logo">
                ⚡RNGymHub
            </a>
            <nav>
                <ul class="nav-links">
                    <li class="nav-item">
                        <a href="workouts.html" id="nav-workouts">🏋️ Treinos</a>
                    </li>
                    <li class="nav-item">
                        <a href="history.html" id="nav-history">📊 Histórico</a>
                    </li>
                    <li class="nav-item">
                        <a href="create-workout.html" id="nav-create" class="btn-create-nav active">➕ Criar Ficha</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <header>
            <h1 id="page-title">Nova Ficha de Treino</h1>
            <p class="subtitle">Monte sua rotina de exercícios personalizada</p>
        </header>

        <div class="form-card">
            <div class="form-group">
                <label for="workout-name">Nome do Treino</label>
                <input type="text" id="workout-name" placeholder="Ex: Treino B - Costas e Bíceps">
            </div>

            <div class="form-group">
                <label for="workout-desc">Descrição (opcional)</label>
                <input type="text" id="workout-desc" placeholder="Ex: Foco em remadas e braços">
            </div>
        </div>

        <div class="exercise-selection">
            <div class="section-header">
                <h3>Exercícios na Ficha</h3>
            </div>

            <div id="added-list" class="added-list-container">
                <p class="empty-msg">Nenhum exercício adicionado ainda.</p>
            </div>

            <hr class="divider">

            <div class="form-group">
                <label for="select-exercise">Selecione o Exercício</label>
                <div class="select-with-action">
                    <select id="select-exercise"></select>
                    <button type="button" class="btn-delete-icon" onclick="deleteSelectedExercise()" title="Deletar exercício do banco">
                        🗑️
                    </button>
                </div>
                <button type="button" class="link-new-ex" onclick="toggleModal(true)">+ Cadastrar Novo Exercício</button>
            </div>

            <div class="grid-2-col">
                <div class="form-group">
                    <label for="target-sets">Séries Alvo</label>
                    <input type="number" id="target-sets" value="3" min="1">
                </div>
                <div class="form-group">
                    <label for="target-reps">Reps Alvo</label>
                    <input type="number" id="target-reps" value="10" min="1">
                </div>
            </div>

            <button type="button" class="btn-secondary" onclick="addExerciseToState()">+ Adicionar à Ficha</button>
        </div>

        <!-- Grupo de Ações Finais: Dois botões independentes -->
        <div class="actions-group">
            <button type="button" class="btn-outline" onclick="saveWorkout(false)">Apenas Salvar Ficha</button>
            <button type="button" class="btn-finish" onclick="saveWorkout(true)">Salvar e Iniciar Ficha</button>
        </div>
    </div>

    <!-- Modal para criar novo exercício -->
    <div class="modal" id="ex-modal">
        <div class="modal-content">
            <h3>Novo Exercício</h3>
            <div class="form-group">
                <label for="new-ex-name">Nome do Exercício</label>
                <input type="text" id="new-ex-name" placeholder="Ex: Puxada Frontal">
            </div>
            <div class="form-group">
                <label for="new-ex-muscle">Grupo Muscular Alvo</label>
                <input type="text" id="new-ex-muscle" placeholder="Ex: Costas">
            </div>
            <button type="button" class="btn-finish" style="margin-top: 12px;" onclick="createNewExercise()">Cadastrar</button>
            <button type="button" class="btn-secondary" style="margin-top: 8px;" onclick="toggleModal(false)">Cancelar</button>
        </div>
    </div>

    <script src="create-workout.js"></script>
    <script src="nav.js" defer></script>

</body>

</html>
